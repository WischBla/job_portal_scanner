<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Assistant</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <span class="brand">Job Assistant</span>
    <nav id="nav">
      <button class="tab" data-view="jobs">Jobs</button>
      <button class="tab" data-view="applications">Applications</button>
      <button class="tab" data-view="profile">Profile</button>
      <button class="tab" data-view="config">Config</button>
    </nav>
  </div>
</header>

<main class="wrap" id="main">

  <!-- ============================ JOBS ============================ -->
  <section id="view-jobs" class="view">
    <div class="action-row">
      <button id="scan-btn" class="primary">Scan for new jobs</button>
      <span id="scan-status" class="muted"></span>
    </div>
    <div id="job-summary" class="summary"></div>
    <div id="scan-summary" class="scan-summary" hidden></div>
    <div id="job-list" class="list"></div>
  </section>

  <!-- ======================== APPLICATIONS ======================== -->
  <section id="view-applications" class="view">
    <div class="action-row">
      <button id="new-application" class="primary">New application</button>
      <span id="application-status" class="muted"></span>
    </div>
    <div id="pipeline" class="pipeline"></div>
    <div id="application-list" class="list"></div>
  </section>

  <!-- =========================== PROFILE ========================== -->
  <section id="view-profile" class="view">
    <div id="profile-form"></div>
  </section>

  <!-- ============================ CONFIG ========================== -->
  <section id="view-config" class="view">
    <div id="config-body"></div>
  </section>

</main>

<div id="dialog" class="dialog" hidden>
  <div class="dialog-card">
    <div class="dialog-head">
      <h2 id="dialog-title"></h2>
      <button id="dialog-close" class="ghost" aria-label="Close">Close</button>
    </div>
    <div id="dialog-body" class="dialog-body"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="/app.js"></script>
</body>
</html>
